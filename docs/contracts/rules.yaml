# Stable rule IDs for Imagine. source = section number in docs/architecture-proposal.md.
# cover: instructions (marker in skills/agents/hooks) | tests (ID in a test) | both
# status: active (default) | deferred. A deferred rule is kept for the record and skipped by coverage;
#   replan = why the rule changed in the 2026-10-31 Phase 1 re-plan (cut commands, enforcement moved to instructions).
rules:
  # Process
  - { id: PROC-BRIEF-START, source: "section 2.6", text: "Before every stage, and again after resume or compaction, read every file on the stage's mandatory list (from the skill) in full", cover: instructions, replan: "brief and stage start|finish cut; skill lists the files to read" }
  - { id: PROC-BRIEF-EMBED, source: "section 2.6", text: "Subagent dispatch embeds the full contents of the stage's mandatory files; the patch echoes their hashes in inputs", replan: "brief and stage start|finish cut; skill lists the files to read" }
  - { id: PROC-BRIEF-AUDIT-CANON, source: "section 2.6", text: "Every audit/review stage lists bible.yaml and style.md as mandatory project references", cover: instructions, replan: "brief and stage start|finish cut; skill lists the files to read" }
  - { id: PROC-BRIEF-LIMIT, source: "section 2.6", text: "Reading the mandatory files proves delivery, not understanding; audits and validators check comprehension", replan: "brief and stage start|finish cut; skill lists the files to read" }
  - { id: PROC-LOCK-HASHED-WRITES, source: "section 3.2", text: "Hashed sources are written only by the main agent or by patch apply; planning subagents have no Write tool; status detects any hash change", cover: instructions, replan: "lock and doc write cut (one user, one main agent)" }
  - { id: PROC-ATOMIC-COMMIT, source: "section 3.2", text: "Commits are temp file + rename; a crash before rename leaves the target untouched", cover: tests }
  - { id: PROC-JOURNAL, source: "section 5", text: "Every state change appends a journal entry", cover: both }
  - { id: PROC-DISPATCH-GUARD, source: "section 3.2", text: "Before every dispatch record sha256 of protected files and re-hash after it; on mismatch restore the recorded copy and reject the output", cover: instructions, replan: "guard cut; main agent hashes protected files by instruction" }
  - { id: PROC-PATCH-VERBATIM, source: "section 3.2", text: "Store the subagent patch verbatim in stage/<stage>/r<n>.patch.yaml" }
  - { id: PROC-PATCH-ROUNDS, source: "section 3.2", text: "Rejected patch goes back to the same subagent, round n+1, max 3, then blocked" }
  - { id: PROC-AUDIT-REREAD, source: "section 3.2", text: "Main-agent semantic audit re-reads bible.yaml and style.md from disk before every audit" }
  - { id: PROC-IMPACT-CONFIRM, source: "section 6.2", text: "Before editing an approved doc show which gates/items re-open and get a yes" }
  - { id: PROC-NEEDS-REVIEW-REPORT, source: "section 6.2", text: "needs_review is resolved by an impact report and the user's confirm or edit" }
  - { id: PROC-UPSTREAM-BLOCKED, source: "section 6.2", text: "Upstream discovery (missing bible fact) is blocked, then bible edit, then cascade" }
  - { id: PROC-SUBAGENT-NO-USER, source: "section 3.1", text: "Subagents never ask the user; unknowns become blocked + question" }
  - { id: PROC-SUBAGENT-PROPOSAL-ONLY, source: "section 3.1", text: "Subagents never approve their own work; output is a proposal" }
  - { id: PROC-STYLE-FIRST, source: "section 3.1", text: "style.md decides artistic choices; advisory defaults fill silence only" }
  - { id: PROC-ADV-REASON, source: "section 3.1", text: "Departing from an advisory default carries a one-line reason" }
  - { id: PROC-HARD-OVER-STYLE, source: "section 3.1", text: "HARD rules are never traded for style" }
  - { id: PROC-CANON-CITE, source: "section 3.1", text: "Subagents read bible.yaml and style.md in full and cite ids/anchors with hashes in inputs" }
  - { id: PROC-NOT-HEARD, source: "section 8.3", text: "Claude reports measured audio facts and states it did not hear the audio" }
  - { id: PROC-NO-DESCRIBE, source: "section 1.2", text: "Never use hyperframes snapshot --describe" }
  - { id: PROC-TELEMETRY-OFF, source: "section 1.2", text: "HYPERFRAMES_NO_TELEMETRY=1 for every hyperframes call", cover: both }
  - { id: PROC-SCRATCH-NOT-ASSET, source: "section 7.3", text: "Scratch VO and auditions live in tmp/ and are never approved assets", cover: both }
  - { id: PROC-ONE-LINE-PER-WAV, source: "section 7.3", text: "TTS synthesises one script line per WAV", cover: both }
  - { id: PROC-CLONING-OPT-IN, source: "D11", text: "English voices built-in by default; cloning only after explicit user opt-in via voice-cloning.md" }
  - { id: PROC-NO-GATED-LOGIN, source: "D11", text: "Imagine never accepts gated model terms or logs in to HF for the user" }
  - { id: PROC-VOICE-CONSENT, source: "D11", text: "Cloned voice needs the voice owner's written consent recorded in the bible" }
  - { id: PROC-ID-EXPERIMENTAL, source: "D9", text: "Indonesian TTS is EXPERIMENTAL; voice prompts judged per clip at casting" }
  - { id: PROC-REMOTE-LISTEN, source: "section 7.3", text: "No audio page in Phase 1: list WAV paths; on another device send the WAVs with SendUserFile", replan: "audio-page deferred" }
  - { id: PROC-REVISED-PROMPT, source: "section 7.1", text: "Record the image tool's revised prompt beside the compiled prompt", cover: both }
  - { id: PROC-FRAMING-IN-PROMPT, source: "section 7.1", text: "Every batch prompt states framing explicitly", cover: both }
  - { id: PROC-IMG-RETRY, source: "section 7.1", text: "Image post-check failure retries at most 2 times, then blocked", cover: both }
  - { id: PROC-RESUME-IDEMPOTENT, source: "section 6.1", text: "Adapters are idempotent per (id, v); partials in tmp/; resume never duplicates approved assets", cover: both }
  - { id: PROC-VERSIONS-IMMUTABLE, source: "section 6.1", text: "Assets are .vN and never overwritten; approved takes immutable", cover: both }
  - { id: PROC-PRONUNCIATION-LEVERS, source: "section 7.3", text: "Pronunciation levers are lexicon, punctuation, voice, seed, temperature; no SSML/phoneme/speed/pitch/emotion" }
  - { id: PROC-FORMAT-ONE-PER-PROJECT, source: "section 5.5", text: "One project, one format; other format = separate project" }
  - { id: PROC-AUDIO-MODE-LOCKED, source: "section 4.1", text: "audio_mode changes only by user at project level; re-opens G1 and the plan" }
  - { id: PROC-MODE-NA-RECORDED, source: "section 4.1", text: "Casting/TTS in non-narrated modes are recorded N/A, not skipped" }
  - { id: PROC-MUSIC-SOURCE, source: "section 7.4", text: "Music user-supplied with licence or none; MusicGen only opt-in non-commercial" }
  - { id: PROC-NO-UPSCALER, source: "section 7.2", text: "No upscaler assumed; lanczos never counts toward q" }
  - { id: PROC-CAMERA-WRAPPER, source: "section 3.4", text: "Ken Burns tweens a wrapper transform, never the timed media" }
  - { id: PROC-CONTINUITY-PRIORITY, source: "section 3.7", text: "Continuity findings are P0/P1/P2 with location, problem, exact change; P0 cites bible id or style anchor" }
  - { id: PROC-CANNOT-OPEN, source: "section 3.7", text: "A reviewer that cannot open an image says so; never assumes it passed" }
  - { id: PROC-CONTINUITY-MODES, source: "section 3.7", text: "Continuity review runs in three modes: canonical refs before G5r, batch assets before G5b (also vs their refs), snapshot sheets in edit" }
  - { id: PROC-CLOCK-PER-MODE, source: "section 4.1, D3", text: "Previz clock = scratch VO (narrated, measured before previz, never an asset) | beat grid (music-led) | read-time plan (text-led)", cover: both }
  - { id: PROC-STORYBOARD-NO-DROP, source: "section 3.3", text: "Impossible duration → propose cuts to the main agent; never drop script units silently" }
  - { id: PROC-PREVIZ-NO-STRETCH, source: "section 3.4", text: "VO longer than plan by > 20 % → flag a storyboard issue; never stretch silently" }
  - { id: PROC-SCENE-LINT-BLOCKED, source: "section 3.6", text: "Scene cannot pass lint in 3 tries → blocked with the lint JSON" }
  - { id: PROC-CONFLICT-REDISPATCH, source: "section 10.2 Q2", text: "Patch CONFLICT always re-dispatches after re-reading the mandatory files (auto-rebase not implemented)", cover: both, replan: "brief and stage start|finish cut; skill lists the files to read" }
  - { id: PROC-BIBLE-REFS-STYLE, source: "D4", text: "bible.yaml states what is true; it references style.md anchors (style.md#palette) and never duplicates grading, lens or grain" }
  - { id: PROC-CAPTION-ORIGINAL, source: "section 5.1", text: "Captions keep the original spelling; the lexicon changes only tts_text", cover: both }
  - { id: PROC-CAPTIONS-FROM-UNITS, source: "section 4.1", text: "narrated captions derive from L##; in other modes T## are the on-screen text and caption rules apply to them" }
  - { id: PROC-G5A-PARALLEL, source: "section 4", text: "Final VO and G5a may run while batch images generate; neither waits for the other" }
  - { id: PROC-G6-LISTEN, source: "section 8.3", text: "G6 includes listening to the draft rough mix (ducking, SFX timing)" }
  - { id: PROC-REVIEW-MD, source: "section 8.3", text: "Findings, advice kept with reasons, waivers and soft tiers go into review/REVIEW.md using HyperFrames review.md P0/P1/P2" }
  - { id: PROC-ATEMPO-WARN, source: "section 7.3", text: "ffmpeg atempo ±10 % only on user request, with an audible-quality warning" }
  - { id: PROC-TTS-FALLBACK, source: "section 7.3", text: "TTS fallbacks: Kokoro via hyperframes tts (no Indonesian) or user-recorded WAV per line, only as listed" }
  - { id: PROC-SFX-SOURCE, source: "section 7.4", text: "SFX via HyperFrames media-use: Openverse CC0/CC-BY with credits, then bundled offline library" }
  - { id: PROC-REPLAN-USER-CHOICE, source: "section 7.2", text: "On replan the user chooses: less scale/travel, less crop, layered rasters, vector ground, or lower delivery size" }
  - { id: PROC-OFFLINE-MIRROR, source: "section 7.5", text: "Offline render needs a GSAP/CDN mirror (HYPERFRAMES_GSAP_BASE_URL)" }
  - { id: PROC-CUTOUT-FALLBACK, source: "section 7.1", text: "Transparency via hyperframes remove-background; generator alpha unverified" }
  - { id: PROC-OPT-IN-MANDATORY, source: "section 2.6, D11", text: "On-demand references become mandatory in the stage's file list once the user opts in (voice-cloning.md for casting)", cover: instructions, replan: "brief and stage start|finish cut; skill lists the files to read" }
  - { id: PROC-EN-BASELINE, source: "D1", text: "English is the baseline language" }
  - { id: ADV-STYLISED-FIRST, source: "D7", text: "Stylised/illustrated looks first" }
  - { id: ADV-LAYERED-PLATES, source: "section 3.3, section 7.2", text: "Layered plates (bg/mid/character/fg) for parallax, reuse and resolution; 9:16 recomposed, not squeezed" }
  # Capability gating
  - { id: CAP-READ, source: "section 2.5", text: "Read capabilities --json once per session and after upgrades", status: deferred, replan: "capabilities command and fallback tables cut" }
  - { id: CAP-FALLBACK-TABLE, source: "section 2.5", text: "not_implemented/experimental → only the fallback listed for that exact step", status: deferred, replan: "capabilities command and fallback tables cut" }
  - { id: CAP-BLOCKED-STOP, source: "section 2.5", text: "No allowed fallback → stop with BLOCKED, record in project.yaml + journal, tell the user", cover: both }
  - { id: CAP-HARD-NO-FALLBACK, source: "section 2.5", text: "HARD validators have no fallback; only exit is a user waiver recorded in REVIEW.md", cover: instructions, replan: "waiver CLI cut; waivers become a REVIEW.md section with the user's quote" }
  - { id: CAP-ADV-NOT-RUN, source: "section 2.5", text: "Unimplemented advisory checks reported not_run, never pass", cover: both }
  - { id: CAP-NO-FABRICATION, source: "section 2.5", text: "Never fabricate command output or treat a missing capability as available" }
  # Gates
  - { id: GATE-G0, source: "section 4", text: "G0: format, platform, audio_mode, language, duration, silence choice" }
  - { id: GATE-G1, source: "section 4", text: "G1: locked script units per unit" }
  - { id: GATE-G2, source: "section 4", text: "G2: bible per entity incl. voice cast after audition and lexicon" }
  - { id: GATE-G3, source: "section 4", text: "G3: style per anchor" }
  - { id: GATE-G4, source: "section 4", text: "G4: production plan, prompts, ref list, tiers, estimate, music licence" }
  - { id: GATE-G5R, source: "section 4", text: "G5r: each canonical ref after continuity review, before any batch" }
  - { id: GATE-G5A, source: "section 4", text: "G5a: audio by ear per line/cue; N/A if silence chosen" }
  - { id: GATE-G5B, source: "section 4", text: "G5b: every batch image incl. soft tiers" }
  - { id: GATE-G6, source: "section 4", text: "G6: picture lock with draft MP4 full mix by ear" }
  - { id: GATE-G7, source: "section 4", text: "G7: final MP4 accepted" }
  - { id: GATE-QUOTE, source: "section 2.4", text: "A gate is recorded only after an explicit user answer, with the verbatim quote", cover: both }
  - { id: GATE-PER-ITEM, source: "section 4", text: "Approvals per item; invalidation re-opens affected items only", cover: both }
  # Waivers
  - { id: HARD-WAIVER-USER-ONLY, source: "section 8.0", text: "Only the user grants waivers; agents may propose; subagents neither", cover: instructions, replan: "waiver CLI cut; waivers become a REVIEW.md section with the user's quote" }
  - { id: HARD-WAIVER-SCOPED, source: "section 8.0", text: "Waiver = one rule + explicit item ids, never all", cover: instructions, replan: "waiver CLI cut; waivers become a REVIEW.md section with the user's quote" }
  - { id: HARD-WAIVER-REASONED, source: "section 8.0", text: "Waiver carries user reason and manual check", cover: instructions, replan: "waiver CLI cut; waivers become a REVIEW.md section with the user's quote" }
  - { id: HARD-WAIVER-HASH-BOUND, source: "section 8.0", text: "Waiver is invalid when a scoped item's content changes; the main agent re-checks the item hash recorded in the waiver entry", cover: instructions, replan: "waiver CLI cut; waivers become a REVIEW.md section with the user's quote" }
  - { id: HARD-WAIVER-LISTED, source: "section 8.0", text: "Waivers are recorded in the REVIEW.md waivers section with the user's quote, and listed in the delivery note", cover: instructions, replan: "waiver CLI cut; waivers become a REVIEW.md section with the user's quote" }
  - { id: HARD-NON-WAIVABLE, source: "section 8.0", text: "Non-waivable: gate quotes, patch/key isolation/base rev, guard, asset approval+hash incl refs, audio licence, placeholders, playable MP4 at G0 spec", cover: both, replan: "waivers are REVIEW.md entries; list unchanged; gate quotes and patch rules stay tool-enforced" }
  - { id: HARD-NO-SELF-JUDGEMENT, source: "section 8.0", text: "Agent judgement never substitutes a HARD tool result" }
  # HARD rules
  - { id: HARD-HF-STRICT, source: "section 8.1", text: "check --json --strict clean (errors and warnings, motion assertions)", cover: instructions, replan: "check cut; skill calls npx hyperframes@0.8.223 directly" }
  - { id: HARD-HF-ALLOWLIST, source: "D10", text: "Only contrast_aa_failure inside a shader-transition window is demoted to advisory", cover: instructions, replan: "check cut; skill calls npx hyperframes@0.8.223 directly" }
  - { id: HARD-FPS-SIZE, source: "section 8.1", text: "30 fps; W×H/aspect = G0", cover: both }
  - { id: HARD-DURATION, source: "section 8.1", text: "Duration inside G0 range", cover: both }
  - { id: HARD-STORY-IDS, source: "section 8.1", text: "Unique sNN shot ids; heading count = parsed shots", cover: both }
  - { id: HARD-STORY-UNIT-ONCE, source: "section 8.1", text: "Every L##/T## placed exactly once (J/L cuts allowed)", cover: both }
  - { id: HARD-VO-NO-OVERLAP, source: "section 8.1", text: "No unintended VO overlap; total VO fits root duration", cover: both }
  - { id: HARD-TEXTLED-READTIME, source: "section 4.1", text: "text-led: every T## on screen ≥ its read time", cover: instructions, replan: "readtime cut; formula max(1.2, 0.5 + 0.3 x words) lives in the skill" }
  - { id: HARD-MUSICLED-ASSET, source: "section 4.1", text: "music-led: music asset present and licensed", cover: both }
  - { id: HARD-MUSICLED-BEAT, source: "section 4.1", text: "music-led: on_beat cuts within ±1 frame of the grid", cover: instructions, replan: "beats cut; grid comes from npx hyperframes@0.8.223 beats" }
  - { id: HARD-REFS-APPROVED, source: "section 4", text: "Batch images only from G5r-approved refs at current version (REFS_NOT_APPROVED)", cover: both }
  - { id: HARD-ENTITIES-EXIST, source: "section 8.1", text: "Referenced bible entities and style anchors exist", cover: both }
  - { id: HARD-PATCH-KEYS, source: "section 3.2", text: "Patch keys ⊆ stage key set; only storyboard writes narrative", cover: both }
  - { id: HARD-PATCH-BASE-REV, source: "section 3.2", text: "base_story_rev matches or CONFLICT", cover: both }
  - { id: HARD-PATCH-REVERIFY, source: "section 3.2", text: "apply re-hashes inputs and re-validates; mismatch STALE_INPUTS, nothing written", cover: both, replan: "lock cut; atomic temp file + rename remains" }
  - { id: HARD-PATCH-INPUTS-DECLARED, source: "section 3.2", text: "inputs declared for every bible id/anchor/unit ops reference", cover: both }
  - { id: HARD-ASSETS-APPROVED, source: "section 8.1", text: "Every asset ref exists, approved, hash matches", cover: both }
  - { id: HARD-AUDIO-ID, source: "section 8.1", text: "Every <audio> has an id", cover: both }
  - { id: HARD-VO-PRESENT, source: "section 8.1", text: "narrated: VO present for every L##", cover: both }
  - { id: HARD-AUDIO-STREAM, source: "section 8.1", text: "Output has an audio stream (digital silence if silence chosen)", cover: both }
  - { id: HARD-NO-PLACEHOLDER, source: "section 8.1", text: "No TODO/TBD/lorem/status: outline/{{/missing src", cover: both }
  - { id: HARD-RASTER-TIER, source: "section 7.2", text: "No replan tier; soft only if accepted at G4 and G5b", cover: both }
  - { id: HARD-NO-NATIVE-CLAIM, source: "section 7.2", text: "Say native only if every raster q ≥ 1.0", cover: both }
  - { id: HARD-SAFE-BAND, source: "section 5.5", text: "9:16 readable text inside platform band, not under the action rail, ≥ 28 px; manual check at G6 recorded in REVIEW.md", cover: instructions, replan: "safe-band deferred" }
  - { id: HARD-STAYS-IN-FRAME, source: "section 8.1", text: "Intended elements stay in frame unless allow-overflow + reason", cover: both }
  - { id: HARD-AUDIO-LICENCE, source: "section 7.4", text: "Third-party audio has licence + source + credit", cover: both }
  - { id: HARD-LOUDNESS, source: "section 8.1", text: "−16 LUFS ±1.5, true peak ≤ −1 dBTP; skipped for intentional silence", cover: both }
  - { id: HARD-GATES-RECORDED, source: "section 8.1", text: "Gates recorded with user quote before downstream work", cover: both }
  - { id: HARD-BRIEF-CURRENT, source: "section 2.6", text: "A stage starts only after its mandatory files were read in this context; the patch echoes their hashes (not tool-verified)", cover: instructions, replan: "brief and stage start|finish cut; skill lists the files to read" }
  - { id: HARD-WAIVERS-VALID, source: "section 8.1", text: "Waivers valid: scoped item hashes match, user quote present (REVIEW.md entry)", cover: instructions, replan: "waiver CLI cut; waivers become a REVIEW.md section with the user's quote" }
  - { id: HARD-GUARD, source: "section 3.2", text: "Protected files unchanged across a dispatch", cover: instructions, replan: "guard cut; main agent hashes protected files by instruction" }
  - { id: HARD-SHADOW-ONLY, source: "section 3.6", text: "scene-builder writes only inside stage/edit/<id>/ (PreToolUse hook)", cover: both, replan: "guard cut; hook stays tool-enforced" }
  - { id: HARD-NO-CSS-FILTER-RASTER, source: "section 3.5", text: "No CSS filter on rasters; use media-treatment", cover: both }
  - { id: HARD-FX-TOOL-ENUM, source: "section 3.5", text: "fx tool ∈ shader|vfx-chain|media-treatment|registry:<name>|css-blend|css-mask; names exist", cover: both }
  - { id: HARD-FX-WEBGL-FALLBACK, source: "section 3.5", text: "WebGL fx declare a fallback; unavailable effects marked unsupported", cover: both }
  - { id: HARD-PREVIZ-SCALE-BUDGET, source: "section 3.4", text: "Max scale per layer ≤ resolution budget", cover: instructions, replan: "res-budget deferred; skill computes from required_px, qc reports measured q" }
  - { id: HARD-PREVIZ-NAMES-EXIST, source: "section 3.4", text: "Transition/shader/registry names exist", cover: both }
  - { id: HARD-PREVIZ-SAFE-AREA, source: "section 3.4", text: "Text-bearing moves stay in the format's safe area", cover: both }
  - { id: HARD-PREVIZ-BEATS-INSIDE, source: "section 3.4", text: "Beats inside their shot", cover: both }
  - { id: HARD-STORYBOARD-ASSET-DECL, source: "section 3.3", text: "Each asset declared with kind and required_px; duration_est sum inside G0", cover: both }
  - { id: HARD-SCENE-LINT, source: "section 3.6", text: "Scene composition lint clean, fromTo in scenes, timeline registered under id", cover: both }
  - { id: HARD-NO-BEST-EFFORT, source: "section 7.5", text: "Renders use --no-best-effort", cover: both }
  - { id: HARD-ROOT-MOTION, source: "section 7.5", text: "Assertions live in root index.motion.json with film-absolute seconds", cover: both }
  - { id: HARD-SCENE-CLASS, source: "section 7.5", text: "Scene hosts use data-composition-src and class=scene", cover: both }
  - { id: HARD-HAS-VOICE-CLONING, source: "section 7.3", text: "File voice requires has_voice_cloning = true", cover: both }
  - { id: HARD-REAL-RASTER, source: "section 7.1", text: "Image is a real raster: PNG, not uniform, measured dims; prompt forbids scripting a PNG", cover: both }
  - { id: HARD-TTS-EOS, source: "section 7.3", text: "KPOCKET_TTS_ERROR_WITHOUT_EOS=1", cover: both }
  - { id: HARD-STYLE-OUTPUT-READONLY, source: "section 5.2", text: "style.md#output is generated from G0 and read-only", cover: both }
  - { id: HARD-STORY-WRITERS, source: "section 5.3", text: "STORY.md written only by patch apply (planning keys) and imagine-kit (edit keys); HyperFrames editStoryboard never used", cover: both }
  - { id: HARD-STATUS-DERIVED, source: "section 6.1", text: "stale is derived by status from recorded hashes, never hand-edited; needs_review is recorded by the main agent from an impact report", cover: both, replan: "status computes hash-based stale only; needs_review is agent-judged from an impact report" }
  # Advisory
  - { id: ADV-READ-WINDOW, source: "section 8.2", text: "Holds 0.5 s + 0.3 s/word for non-copy text" }
  - { id: ADV-EASE-ROLE, source: "section 8.2", text: "Ease by role" }
  - { id: ADV-HERO-MOVE, source: "section 8.2", text: "One hero move per shot" }
  - { id: ADV-EXIT-ENTRANCE, source: "section 8.2", text: "Exits shorter than entrances" }
  - { id: ADV-TRANSITION-KINDS, source: "section 8.2", text: "3–5 transition kinds" }
  - { id: ADV-HARD-CUTS, source: "section 8.2", text: "≤ ⅓ hard cuts between beats" }
  - { id: ADV-SHOT-LENGTH, source: "section 8.2", text: "Shot length averages; shot vs its VO (lead/trail allowed)" }
  - { id: ADV-HERO-40, source: "section 3.3", text: "Hero ≥ 40 % of frame; one idea per shot" }
  - { id: ADV-NEW-EVERY, source: "section 3.3", text: "Something new every 2–4 s" }
  - { id: ADV-VERTICAL, source: "section 5.5", text: "9:16 pacing 1–2 s shots, titles ×1.35, ≤ ~5 words per claim line" }
  - { id: ADV-BANNED, source: "section 3.5", text: "style.md#banned and HyperFrames BANNED defaults unless style allows" }
  - { id: ADV-CHECK-WARNINGS, source: "section 8.2", text: "line_unread/dead_stretch/text_below_floor reported as advice" }
  - { id: ADV-FILM-SILENT, source: "section 4.1", text: "film_silent suppressed with reason when G0 silence intentional" }
  # Dependency DAG
